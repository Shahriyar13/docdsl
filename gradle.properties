# The coordinates every module publishes under. Kept here so a release is a one-line change rather than an
# edit in each module, and so a mismatch between the two modules is impossible.
docdslGroup=app.duss.docdsl
docdslVersion=0.1.0

# ---- POM metadata -------------------------------------------------------------------------------------
# Maven Central rejects a publication that omits any of these, and the values are identical for both
# modules, so they live here rather than being repeated.
docdslUrl=https://github.com/Shahriyar13/docdsl
docdslScmConnection=scm:git:https://github.com/Shahriyar13/docdsl.git
docdslScmDeveloperConnection=scm:git:ssh://git@github.com/Shahriyar13/docdsl.git
docdslLicenceName=The Apache License, Version 2.0
docdslLicenceUrl=https://www.apache.org/licenses/LICENSE-2.0.txt
docdslDeveloperId=Shahriyar13
docdslDeveloperName=Shahriyar Aghajani

# ---- build behaviour ----------------------------------------------------------------------------------
kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true
